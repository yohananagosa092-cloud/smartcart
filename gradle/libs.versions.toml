[versions]
agp = "9.5.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.13.0"
constraintlayout = "2.1.4"
navigation = "2.10.2"
lifecycle = "2.11.0"
fragmentKtx = "1.9.1"
coroutines = "1.9.0"
